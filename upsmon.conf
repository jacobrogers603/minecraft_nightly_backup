# --- Which UPS to monitor (your Synology NUT server) ---
MONITOR ups@192.168.0.128 1 monuser secret slave

# --- The command WinNUT runs on events (we'll restrict WHEN below) ---
NOTIFYCMD "C:\\minecraft\\mcShutdown.bat"

# --- Notification policy: log most events, EXEC only on FSD ---
NOTIFYFLAG ONLINE   SYSLOG
NOTIFYFLAG ONBATT   SYSLOG
NOTIFYFLAG LOWBATT  SYSLOG          ; no EXEC here
NOTIFYFLAG FSD      SYSLOG+EXEC     ; ONLY this can run the script

# --- Comms behavior (avoid false triggers on boot/network hiccups) ---
MINSUPPLIES 1
POLLFREQ 10
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 120          ; wait 2 min of lost comms before calling it "dead"
NOCOMMWARNTIME 600    ; warn after 10 min no comms (log only)

# --- Give yourself a bigger window to cancel if it ever triggers ---
FINALDELAY 30         ; you have timeto kill the service

# --- Optional, but tidy defaults you were using ---
RBWARNTIME 43200 