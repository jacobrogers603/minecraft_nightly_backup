# --- Which UPS to monitor (Synology NUT master) ---
MONITOR ups@192.168.0.128 1 monuser secret slave

# --- Only run your script on FSD from Synology ---
NOTIFYCMD "C:\\minecraft\\mcShutdown.bat"
NOTIFYFLAG ONLINE   SYSLOG
NOTIFYFLAG ONBATT   SYSLOG
NOTIFYFLAG LOWBATT  SYSLOG
NOTIFYFLAG FSD      SYSLOG+EXEC      # ONLY this runs the script

# --- Never self-shutdown on low battery; wait for FSD ---
IGNORELB yes

# --- Poll fast so we catch FSD quickly; be calm on comm hiccups ---
POLLFREQ 2
POLLFREQALERT 1
MINSUPPLIES 1
HOSTSYNC 15
DEADTIME 120
NOCOMMWARNTIME 600

# --- Let the script/Windows get a tiny head start before upsmon exits ---
FINALDELAY 5

# --- Optional battery reminder interval ---
RBWARNTIME 43200
