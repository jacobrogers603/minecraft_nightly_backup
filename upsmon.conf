# --- Which UPS to monitor (Synology NUT master) ---
MONITOR ups@192.168.0.128 1 monuser secret slave

# --- Run your PowerShell script ONLY on FSD ---
NOTIFYCMD "powershell.exe -ExecutionPolicy Bypass -File C:\\minecraft\\mcShutdown.ps1"
NOTIFYFLAG ONLINE   SYSLOG
NOTIFYFLAG ONBATT   SYSLOG
NOTIFYFLAG LOWBATT  SYSLOG
NOTIFYFLAG FSD      SYSLOG+EXEC    # ONLY this runs your script

# --- IMPORTANT: Stop WinNUT from doing its own OS shutdown on LOWBATT ---
# WinNUT requires SHUTDOWNCMD; point it to a no-op that returns 0.
SHUTDOWNCMD "cmd.exe /c exit 0"

# --- Polling / tolerance ---
POLLFREQ 2
POLLFREQALERT 1
MINSUPPLIES 1
HOSTSYNC 15
DEADTIME 120
NOCOMMWARNTIME 600

# --- Give your script time to warn/save/stop before upsmon exits ---
FINALDELAY 20

# Optional battery reminder
RBWARNTIME 43200
